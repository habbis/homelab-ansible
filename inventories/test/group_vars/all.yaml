puppet_server: hf-puppet1.dc1.ncop.no
puppet_release: 8
debian_debfile: "openvox{{ puppet_release }}-release-debian{{ ansible_distribution_major_version }}.deb"
rpmfile: "openvox{{ puppet_release }}-release-el-{{ ansible_distribution_major_version }}.noarch.rpm"
package: openvox-agent
service: puppet
delete_puppet_ssl_dir: false
apt_purge: false
yum_purge: false
run_puppet_agent: true
fix_hosts: false
#offline install
offline_rpmfile: false
offline_ubuntu_debfile: false
offline_debain_debfile: false
# online install
online_rpmfile: true
online_ubuntu_debfile: true
online_debian_debfile: true
# if having problem with
# apt update repo proble
fix_apt_missing: false
